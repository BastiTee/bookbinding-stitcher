version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    assignees:
      - "BastiTee"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    groups:
      npm-dev-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "BastiTee"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    groups:
      github-actions:
        patterns:
          - "*"
